<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时光胶囊 · 寄往未来</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="capsule.css">
</head>
<body>
<div class="paper-texture"></div>

<nav class="nav">
  <div class="nav-inner">
    <a href="../index.html" class="nav-logo">存根簿</a>
    <ul class="nav-links">
      <li><a href="../index.html">首页</a></li>
      <li><a href="../demo.html">翻阅</a></li>
      <li><a href="capsule.html" class="active">时光胶囊</a></li>
      <li><a href="../echo/echo.html">回声库</a></li>
      <li><a href="../journey/journey.html">历程簿</a></li>
      <li><a href="../wishlist/wishlist.html">心愿册</a></li>
      <li><a href="../about.html">关于</a></li>
    </ul>
  </div>
</nav>

<main class="main">
  <!-- Hero -->
  <section class="cap-hero">
    <div class="cap-hero-inner">
      <p class="cap-hero-sub">TIME CAPSULE · 寄往未来</p>
      <h1 class="cap-hero-title">
        <span class="line">把此刻的温度</span>
        <span class="line accent">封进一颗胶囊</span>
      </h1>
      <p class="cap-hero-desc">
        有些话，不必急着说出口<br>
        写下来，封进蜡里<br>
        等某年某月的某一天——<br>
        <span class="highlight">再轻轻拆开</span>
      </p>
      <button class="cap-create-btn" id="createBtn">
        <span>封存一颗胶囊</span>
        <div class="btn-fold"></div>
      </button>
    </div>
    <div class="cap-hero-deco">
      <div class="floating-capsule">
        <div class="cap-shape">
          <div class="cap-top"></div>
          <div class="cap-body">
            <div class="cap-seal">印</div>
          </div>
        </div>
      </div>
      <div class="stars s1"></div>
      <div class="stars s2"></div>
      <div class="stars s3"></div>
    </div>
  </section>

  <!-- 胶囊墙 -->
  <section class="cap-wall">
    <div class="section-header">
      <div class="section-line"></div>
      <h2 class="section-title">胶囊陈列</h2>
      <div class="section-line"></div>
    </div>

    <div class="cap-filter">
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="locked">未到期</button>
      <button class="filter-btn" data-filter="unlocked">可开启</button>
      <button class="filter-btn" data-filter="opened">已开启</button>
    </div>

    <div class="cap-grid" id="capGrid"></div>
  </section>

  <!-- 底部引言 -->
  <section class="cap-quote">
    <div class="quote-mark open">"</div>
    <p>时间会带走很多东西，<br>
    但它带不走你认真封存的温度。<br>
    未来的你，会感谢此刻愿意记录的自己。</p>
    <div class="quote-mark close">"</div>
  </section>
</main>

<!-- 创建胶囊弹窗 -->
<div class="modal-overlay" id="createOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title">封存一颗胶囊</h2>
      <button class="modal-close" id="createClose">&times;</button>
    </div>
    <div class="modal-body">
      <form id="createForm" class="add-form">
        <label>胶囊标题
          <input name="title" placeholder="给一年后的自己" required>
        </label>
        <label>胶囊类型
          <select name="type">
            <option value="self">给自己</option>
            <option value="memory">记忆片段</option>
            <option value="anniversary">纪念日</option>
            <option value="child">给孩子</option>
            <option value="love">给爱人</option>
            <option value="letter">给某个人</option>
          </select>
        </label>
        <label>心情底色
          <select name="mood">
            <option value="warm">温暖</option>
            <option value="soft">柔软</option>
            <option value="happy">开心</option>
            <option value="sad">难过</option>
            <option value="calm">平静</option>
          </select>
        </label>
        <label>开启时间
          <input type="date" name="unlockDate" required>
        </label>
        <label>信的内容
          <textarea name="letter" rows="6" placeholder="在这里写下此刻想说的话..." required></textarea>
        </label>
        <button type="submit" class="add-submit">封蜡 · 寄出</button>
      </form>
    </div>
  </div>
</div>

<!-- 开启胶囊弹窗 -->
<div class="modal-overlay" id="openOverlay">
  <div class="modal cap-open-modal">
    <div class="modal-header">
      <h2 class="modal-title" id="openTitle">胶囊</h2>
      <button class="modal-close" id="openClose">&times;</button>
    </div>
    <div class="modal-body" id="openBody">
    </div>
  </div>
</div>

<footer class="footer">
  <p>存根簿 · Life Stub</p>
  <p class="footer-sub">给重情义的人，一个落脚的地方</p>
</footer>

<script src="capsule-data.js"></script>
<script src="capsule-render.js"></script>
</body>
</html>
